<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dört Taş · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Dört taşı yan yana, alt alta ya da çapraz dizen kazanır. İki kişi ya da bilgisayara karşı.">
  <meta name="theme-color" content="#F1EEFF">
  <meta property="og:title" content="Dört Taş">
  <meta property="og:description" content="Dört taşı bir sıraya dizen kazanır. İki kişi ya da bilgisayara karşı.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9F%A0%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html">← Oyunlar</a>
    <h1 class="title">Dört Taş</h1>
    <div class="bar-actions">
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
      <button class="btn small" id="open-setup" type="button">Ayarlar</button>
    </div>
  </header>

  <section class="players" aria-label="Oyuncular">
    <div class="player p0" id="p0"><span class="disc-mini" aria-hidden="true"></span><span class="av" id="av-0">🚀</span><span class="nm" id="nm-0">Enes</span><b class="sc" id="sc-0">0</b></div>
    <p class="status" id="status" role="status">Sıra Enes'te</p>
    <div class="player p1" id="p1"><b class="sc" id="sc-1">0</b><span class="nm" id="nm-1">Egemen</span><span class="av" id="av-1">🎈</span><span class="disc-mini" aria-hidden="true"></span></div>
  </section>

  <main class="board-wrap" id="boardWrap">
    <div class="board" id="board" role="grid" aria-label="Oyun tahtası, 7 sütun"></div>
  </main>

  <div class="actions">
    <button class="btn" id="undo" type="button">↩ Geri al</button>
    <button class="btn" id="hint" type="button">💡 İpucu</button>
    <button class="btn primary" id="new-round" type="button">Yeni tur</button>
  </div>
</div>

<div class="overlay" id="setup" hidden>
  <form class="sheet" id="setup-form">
    <h2>Oyun ayarları</h2>
    <fieldset>
      <legend>Kim oynuyor?</legend>
      <div class="choices two">
        <label class="choice"><input type="radio" name="mode" id="mode-pvp" value="pvp" checked><span><b>İki kişi</b><small>Aynı tablette sırayla</small></span></label>
        <label class="choice"><input type="radio" name="mode" id="mode-ai" value="ai"><span><b>Bilgisayara karşı</b><small>Tek başına</small></span></label>
      </div>
    </fieldset>
    <fieldset id="ai-level" hidden>
      <legend>Bilgisayar seviyesi</legend>
      <div class="choices three">
        <label class="choice"><input type="radio" name="ai" id="ai-kolay" value="kolay"><span><b>Kolay</b></span></label>
        <label class="choice"><input type="radio" name="ai" id="ai-orta" value="orta" checked><span><b>Orta</b></span></label>
        <label class="choice"><input type="radio" name="ai" id="ai-zor" value="zor"><span><b>Zor</b></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Oyuncular</legend>
      <div class="name-row p0"><span class="disc-mini" aria-hidden="true"></span><input type="text" id="name-0" maxlength="12" value="Enes" aria-label="Mavi taşların oyuncusu" autocomplete="off"></div>
      <div class="name-row p1"><span class="disc-mini" aria-hidden="true"></span><input type="text" id="name-1" maxlength="12" value="Egemen" aria-label="Turuncu taşların oyuncusu" autocomplete="off"></div>
    </fieldset>
    <p class="note">İlk turu turuncu başlatır, sonra her turda sıra değişir. Skorlar bu cihazda saklanır.</p>
    <div class="row">
      <button class="btn primary big" id="start" type="submit">Oyna</button>
      <button class="btn" id="reset-scores" type="button">Skorları sıfırla</button>
    </div>
  </form>
</div>

<div class="overlay light" id="result" hidden>
  <div class="sheet center">
    <p class="res-title" id="res-title">Egemen kazandı!</p>
    <p class="res-sub" id="res-sub"></p>
    <div class="row">
      <button class="btn primary" id="res-again" type="button">Yeni tur <kbd>Enter</kbd></button>
      <button class="btn" id="res-look" type="button">Tahtaya bak</button>
    </div>
  </div>
</div>

<div id="confetti" aria-hidden="true"></div>

<script src="game.js"></script>
</body>
</html>
