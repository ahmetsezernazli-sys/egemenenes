<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boncuk Dizisi · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Egemen için örüntü oyunu: kolyedeki boncukların sırasına bak, eksik boncuğu tak, deseni tamamla. Renk, şekil ve büyüklük desenleri, adım adım zorlaşır; serbest modda kendi kolyeni yap. Okuma gerekmez, her şey sesli anlatılır, kaybetmek yok.">
  <meta name="theme-color" content="#FFE9D2">
  <meta property="og:title" content="Boncuk Dizisi">
  <meta property="og:description" content="Kırmızı, mavi, kırmızı, mavi… sırada hangisi var? Deseni tamamla, kolyeyi hayvan dostuna hediye et!">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23FFE9D2'/%3E%3Cpath d='M14 30 Q50 110 86 30' fill='none' stroke='%23A0703C' stroke-width='3'/%3E%3Ccircle cx='22' cy='48' r='9' fill='%23E5484D'/%3E%3Ccircle cx='36' cy='63' r='9' fill='%233D8BFD'/%3E%3Ccircle cx='50' cy='68' r='9' fill='%23E5484D'/%3E%3Ccircle cx='64' cy='63' r='9' fill='%233D8BFD'/%3E%3Ccircle cx='78' cy='48' r='9' fill='none' stroke='%23A0703C' stroke-width='3' stroke-dasharray='4 3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html" aria-label="Oyunlara dön">← <span class="back-tx">Oyunlar</span></a>
    <h1 class="title">Boncuk <span>Dizisi</span></h1>
    <div class="bar-actions">
      <button class="icon-btn" id="mode" type="button" aria-label="Serbest moda geç">🎨</button>
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
    </div>
  </header>

  <div class="info">
    <span class="pill" id="level" aria-label="Seviye"></span>
    <span class="dots" id="dots" aria-hidden="true"></span>
    <span class="pill" id="stars" aria-label="Toplanan yıldız">⭐ 0</span>
  </div>

  <main class="stage" id="stage">
    <svg class="string" id="string" aria-hidden="true"><path id="string-path"/></svg>
    <div class="animal" id="animal" aria-hidden="true"></div>
    <div class="slots" id="slots" aria-label="Kolye"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

  <div class="tray" id="tray" aria-label="Boncuklar"></div>
  <div class="controls">
    <button class="btn" id="repeat" type="button">🔊 Tekrar dinle</button>
    <button class="btn" id="undo" type="button" hidden>↩ Geri al</button>
    <button class="btn primary" id="done" type="button" hidden>✔ Bitti</button>
    <button class="btn primary" id="next" type="button" hidden>Sıradaki kolye ▶</button>
  </div>
</div>

<div class="overlay" id="start">
  <div class="sheet center">
    <div class="trophy" aria-hidden="true">📿</div>
    <p class="end-title">Boncuk Dizisi</p>
    <p class="help">Kolyedeki boncuklar bir <b>sıraya</b> göre dizilmiş. Sıraya bak, <b>eksik boncuğu</b> aşağıdan seç ve kolyeye tak. Kolye bitince hayvan dostun çok sevinecek!<br>
      Boncuğa <b>dokunmak</b> yeter; istersen sürükleyebilirsin de. 🎨 düğmesiyle kendi kolyeni yapabilirsin.</p>
    <button class="btn primary big" id="go" type="button">Başla</button>
  </div>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
