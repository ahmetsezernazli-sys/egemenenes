<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saklambaç · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Egemen için saklambaç: hayvanlar odaya ve bahçeye saklanır, eşyalara dokunarak bul. Altında, içinde, arkasında gibi yer kelimelerini sesli öğretir. Okuma gerekmez, kaybetmek yok.">
  <meta name="theme-color" content="#FCE9C8">
  <meta property="og:title" content="Saklambaç">
  <meta property="og:description" content="Hayvanlar saklandı! Yatağın altına, dolabın içine bak, hepsini bul.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23FCE9C8'/%3E%3Crect x='18' y='52' width='64' height='34' rx='6' fill='%23E5484D'/%3E%3Ccircle cx='38' cy='46' r='10' fill='%23F5C542'/%3E%3Ccircle cx='34' cy='44' r='2.5' fill='%23222'/%3E%3Ccircle cx='42' cy='44' r='2.5' fill='%23222'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html" aria-label="Oyunlara dön">← <span class="back-tx">Oyunlar</span></a>
    <h1 class="title">Sakla<span>mbaç</span></h1>
    <div class="bar-actions">
      <button class="shelf-btn" id="found-btn" type="button" aria-label="Kaç arkadaş buldun"><span aria-hidden="true">🙈</span><b id="found-n">0</b></button>
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Saklambaç sahnesi. Hayvanların saklandığı eşyalara dokun."></canvas>
    <button class="next" id="next" type="button" aria-label="Yeniden saklanalım" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
    </button>
  </main>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
