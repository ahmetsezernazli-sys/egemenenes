<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yılan · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Enes için klasik yılan oyunu: elmaları ye, uzadıkça hızlan, kendine ve duvarlara çarpma. Altın elma ekstra puan, duvarlı ve duvarsız mod, üç hız, rekor. Klavye, kaydırma ve dokunmatik yön düğmeleri.">
  <meta name="theme-color" content="#0E1A12">
  <meta property="og:title" content="Yılan">
  <meta property="og:description" content="Elmaları ye, uza, kendine çarpma!">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230E1A12'/%3E%3Cpath d='M20 70h40V40h20' stroke='%239BE15D' stroke-width='14' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='80' cy='22' r='8' fill='%23E5484D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html" aria-label="Oyunlara dön">← <span class="back-tx">Oyunlar</span></a>
    <h1 class="title">Yı<span>lan</span></h1>
    <div class="bar-actions">
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
      <button class="btn small" id="open-menu" type="button">Ayarlar</button>
    </div>
  </header>
  <div class="score-row"><span class="chip">Puan <b id="score">0</b></span><span class="chip">Uzunluk <b id="len">3</b></span><span class="chip">Rekor <b id="best">0</b></span></div>
  <main class="stage" id="stage"><canvas id="cv" aria-label="Yılan alanı. Ok tuşları ya da WASD ile yön verilir, boşluk duraklatır."></canvas><div class="msg-ov" id="ov"></div></main>
  <div class="controls">
    <div class="items"><button class="item" id="pause" type="button" aria-label="Duraklat">⏸</button></div>
    <div class="dpad" id="dpad">
      <button type="button" data-d="u" aria-label="Yukarı">▲</button>
      <button type="button" data-d="l" aria-label="Sol">◀</button>
      <button type="button" data-d="r" aria-label="Sağ">▶</button>
      <button type="button" data-d="d" aria-label="Aşağı">▼</button>
    </div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="sheet">
    <h2>🐍 Yılan</h2>
    <p class="help"><b>Ok tuşları / WASD</b> ya da ekranı <b>kaydırarak</b> yön ver. 🍎 elma yedikçe uzarsın ve hızlanırsın. ⭐ <b>altın elma</b> kısa süre görünür, 5 kat puan verir. Kendine (ve duvarlı modda kenarlara) çarparsan oyun biter. <b>Boşluk</b> duraklatır.</p>
    <fieldset><legend>Alan</legend>
      <div class="seg"><label><input type="radio" name="wall" value="0" checked><span>Duvarsız (kenardan geç)</span></label><label><input type="radio" name="wall" value="1"><span>Duvarlı</span></label></div>
    </fieldset>
    <fieldset><legend>Hız</legend>
      <div class="seg"><label><input type="radio" name="spd" value="0"><span>Yavaş</span></label><label><input type="radio" name="spd" value="1" checked><span>Orta</span></label><label><input type="radio" name="spd" value="2"><span>Hızlı</span></label></div>
    </fieldset>
    <p class="best" id="best-line"></p>
    <button class="btn primary big" id="start" type="button">Başla</button>
  </div>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
