<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tombala · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="2-6 kişilik aile tombalası: torbadan taş çek, kartındaki sayıyı bul, çinko yap, tombalayı ilk sen söyle.">
  <meta name="theme-color" content="#16233A">
  <meta property="og:title" content="Tombala">
  <meta property="og:description" content="Torbadan taş çek, kartındaki sayıyı işaretle. Çinko, ikinci çinko ve tombala. 2-6 oyuncu.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='20' width='84' height='60' rx='10' fill='%23FFF6E6'/%3E%3Ccircle cx='32' cy='42' r='11' fill='%23E5484D'/%3E%3Ccircle cx='64' cy='58' r='11' fill='%233D8BFD'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html">← Oyunlar</a>
    <h1 class="title">Tom<span>bala</span></h1>
    <div class="bar-actions">
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
      <button class="btn small" id="open-setup" type="button">Ayarlar</button>
    </div>
  </header>

  <section class="stage">
    <button class="sack" id="draw" type="button">
      <svg class="sack-art" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M30 44c0-10 12-14 30-14s30 4 30 14c14 12 20 30 20 44 0 18-22 26-50 26S10 106 10 88c0-14 6-32 20-44z" fill="#8E2F3D"/>
        <path d="M30 44c0-10 12-14 30-14s30 4 30 14c-8 6-18 9-30 9s-22-3-30-9z" fill="#B23A4C"/>
        <path d="M24 46c10 7 22 10 36 10s26-3 36-10" stroke="#FFC94A" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="47" cy="86" r="15" fill="#F0D3A3"/>
        <circle cx="76" cy="76" r="12" fill="#E3BE86"/>
      </svg>
      <span class="sack-label">Taş çek</span>
    </button>

    <div class="shown">
      <div class="stone big" id="last-stone" aria-live="polite"><span id="last-num">?</span></div>
      <p class="msg" id="msg">Torbada 90 taş var. İlk taşı çek!</p>
      <div class="recent" id="recent" aria-hidden="true"></div>
      <p class="count"><b id="count">0</b> / 90 taş çıktı</p>
    </div>
  </section>

  <main class="cards" id="cards"></main>
</div>

<p class="banner" id="banner" hidden></p>

<div class="overlay" id="setup">
  <form class="sheet" id="setup-form">
    <h2>Tombala</h2>
    <div class="p-rows" id="p-rows"></div>
    <div class="row">
      <button class="btn light" id="add-player" type="button">+ Kart</button>
      <button class="btn light" id="remove-player" type="button">− Kart</button>
    </div>
    <fieldset>
      <legend>Kurallar</legend>
      <label class="toggle"><input type="checkbox" id="hint" checked><span>✨ Çıkan sayı kartlarda parlasın</span></label>
      <label class="toggle"><input type="checkbox" id="autodraw"><span>⏱ Taşlar kendiliğinden çekilsin</span></label>
    </fieldset>
    <p class="help">Bir sıradaki 5 sayıyı da işaretleyen <b>çinko</b> yapar. 15 sayının hepsini ilk bitiren <b>tombala</b> diye bağırır.</p>
    <button class="btn primary big" type="submit">Oyunu başlat</button>
  </form>
</div>

<div class="overlay" id="end" hidden>
  <div class="sheet center">
    <div class="trophy" aria-hidden="true">🏆</div>
    <p class="end-title" id="end-title">Tombala!</p>
    <ol class="podium" id="podium"></ol>
    <div class="row">
      <button class="btn primary" id="again" type="button">Tekrar oyna</button>
      <button class="btn light" id="end-setup" type="button">Ayarlar</button>
    </div>
  </div>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
