<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Denizaltı Macerası · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Egemen için sesli anlatımlı okyanus keşfi: sarı denizaltıyla mercan resifini, açık denizi ve karanlık derinliği gez; palyaço balığından mavi balinaya 20 deniz canlısının fotoğrafını çek, albümü doldur. İnci topla, fener ve turbo motor al. Okuma gerekmez.">
  <meta name="theme-color" content="#1D6FA8">
  <meta property="og:title" content="Denizaltı Macerası">
  <meta property="og:description" content="Okyanusu keşfet, 20 deniz canlısının fotoğrafını çek!">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231D6FA8'/%3E%3Cellipse cx='8' cy='9' rx='6' ry='4' fill='%23FFD23F'/%3E%3Crect x='7' y='3' width='2' height='3' fill='%23FFD23F'/%3E%3Ccircle cx='9' cy='9' r='1.8' fill='%238FD3FF'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html" aria-label="Oyunlara dön">← <span class="back-tx">Oyunlar</span></a>
    <h1 class="title">Denizaltı Macerası</h1>
    <div class="bar-actions">
      <button class="icon-btn" id="speak" type="button" aria-label="Tekrar söyle">🔈</button>
      <button class="icon-btn" id="mute" type="button" aria-label="Sesi kapat" aria-pressed="false">♪</button>
    </div>
  </header>
  <main class="screen" id="screen">
    <div class="stage" id="stage">
      <canvas id="cv" width="960" height="600" aria-label="Okyanus. Parmağını tut, denizaltı oraya gitsin. Canlılara dokun, fotoğrafını çek."></canvas>
      <p class="tip" id="tip"></p>
      <div class="hudbtns"><button class="hb" id="albumBtn" type="button" aria-label="Albüm">📖</button><button class="hb" id="garageBtn" type="button" aria-label="Garaj">🔧</button></div>
      <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
    </div>
  </main>
</div>

<div class="overlay" id="title">
  <div class="logo"><canvas id="logoCv" width="360" height="180" aria-hidden="true"></canvas><h2>Denizaltı Macerası</h2><p>Keşfet · Fotoğraf çek · Albümü doldur</p></div>
  <div class="menu-btns"><button class="pbtn" id="play" type="button">▶ Dalışa başla</button></div>
  <button class="reset" id="reset" type="button" hidden>Albümü sıfırla</button>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
