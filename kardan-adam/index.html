<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kardan Adam · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Egemen için kardan adam: parmağınla karı yuvarla, üç topu üst üste koy, havuç burnunu ve şapkayı tak. Okuma gerekmez, her adım sesli anlatılır.">
  <meta name="theme-color" content="#BFE3F7">
  <meta property="og:title" content="Kardan Adam">
  <meta property="og:description" content="Karı yuvarla, üst üste koy, süsle. Kardan adamın canlansın!">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23BFE3F7'/%3E%3Ccircle cx='50' cy='76' r='20' fill='%23FFFFFF'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23FFFFFF'/%3E%3Ccircle cx='50' cy='28' r='11' fill='%23FFFFFF'/%3E%3Cpath d='M50 28l14 4-14 4z' fill='%23F97316'/%3E%3Crect x='36' y='14' width='28' height='7' rx='2' fill='%23334155'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html" aria-label="Oyunlara dön">← <span class="back-tx">Oyunlar</span></a>
    <h1 class="title">Kardan <span>Adam</span></h1>
    <div class="bar-actions">
      <button class="shelf-btn" id="shelf-btn" type="button" aria-label="Kaç kardan adam yaptın"><span aria-hidden="true">⛄</span><b id="made">0</b></button>
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Kar bahçesi"></canvas>
    <button class="done" id="done" type="button" aria-label="Bitti" hidden>✓</button>
    <button class="next" id="next" type="button" aria-label="Yeni kardan adam" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
    </button>
  </main>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
