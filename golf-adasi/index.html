<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Golf Adası · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="9 delikli mini golf: su, kum, tamponlar, yel değirmeni ve kayan kapılar. 1-4 oyuncu, rekorlar.">
  <meta name="theme-color" content="#0E5A6E">
  <meta property="og:title" content="Golf Adası">
  <meta property="og:description" content="Topu geri çek, bırak, deliğe sok. 9 delik, par ve rekor tablosu.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B3%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html">← Oyunlar</a>
    <h1 class="title">Golf <span>Adası</span></h1>
    <div class="bar-actions">
      <button class="icon-btn" id="card-btn" type="button" aria-label="Skor kartı">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </button>
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
    </div>
  </header>

  <div class="hud" aria-live="polite">
    <span class="chip"><b id="h-hole">1</b><small>/9</small> <em id="h-name">İlk Vuruş</em></span>
    <span class="chip">Par <b id="h-par">2</b></span>
    <span class="chip">Vuruş <b id="h-shots">0</b></span>
    <span class="chip player"><i id="h-ball"></i><span id="h-player">Enes</span></span>
  </div>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Mini golf sahası. Sürükleyip bırakarak ya da ok tuşları ve boşlukla vurulur."></canvas>
    <div class="toast" id="toast" hidden></div>
    <p class="help" id="help">Parmağını topun gerisine sürükle, bırak · <kbd>←</kbd><kbd>→</kbd> nişan <kbd>↑</kbd><kbd>↓</kbd> güç <kbd>Boşluk</kbd> vur</p>
  </main>
</div>

<div class="overlay" id="setup">
  <form class="sheet" id="setup-form">
    <h2>Golf Adası</h2>
    <p class="lead">9 delik. Topu geri çekip bırak, en az vuruşla deliğe sok.</p>
    <fieldset>
      <legend>Oyuncular</legend>
      <div class="p-rows" id="p-rows"></div>
      <button class="btn light small" id="add-player" type="button">+ Oyuncu ekle</button>
    </fieldset>
    <div class="records" id="records" hidden></div>
    <button class="btn primary big" type="submit">Başla</button>
  </form>
</div>

<div class="overlay" id="card" hidden>
  <div class="sheet wide">
    <h2 id="card-title">Skor Kartı</h2>
    <p class="end-note" id="card-note" hidden></p>
    <div class="table-wrap"><table class="score" id="score"></table></div>
    <div class="row" id="card-actions">
      <button class="btn primary" id="card-close" type="button">Devam et</button>
    </div>
    <div class="row" id="end-actions" hidden>
      <button class="btn primary" id="again" type="button">Yeniden oyna</button>
      <button class="btn light" id="change" type="button">Oyuncuları değiştir</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
