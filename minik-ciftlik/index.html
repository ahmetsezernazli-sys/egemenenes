<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minik Çiftlik · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="Egemen için sesli anlatımlı çiftlik oyunu: tohum ek, sula, havuç ve çilek topla; tavuk, inek ve koyunu besle; pazarda hayvan müşterilerin siparişlerini hazırla. Altınla yeni tohum, hayvan ve süs al, yıldızlarla yeni tarlalar aç. Çiftliğin kaydedilir.">
  <meta name="theme-color" content="#7EC8FF">
  <meta property="og:title" content="Minik Çiftlik">
  <meta property="og:description" content="Ek, sula, topla, sat! Egemen'in kendi çiftliği.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%238FD3FF'/%3E%3Crect y='10' width='16' height='6' fill='%235DB34A'/%3E%3Cpath d='M3 10V5l3-3 3 3v5z' fill='%23D8463F'/%3E%3Cpath d='M11 15l1.5-6 1.5 6z' fill='%23FF8A3D'/%3E%3Cpath d='M12.5 9l-1-2m1 2l1-2' stroke='%233FA34D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html" aria-label="Oyunlara dön">← <span class="back-tx">Oyunlar</span></a>
    <h1 class="title">Minik Çiftlik</h1>
    <div class="bar-actions">
      <button class="icon-btn" id="speak" type="button" aria-label="Tekrar söyle">🔈</button>
      <button class="icon-btn" id="mute" type="button" aria-label="Sesi kapat" aria-pressed="false">♪</button>
    </div>
  </header>
  <main class="screen" id="screen">
    <div class="stage" id="stage">
      <canvas id="cv" width="960" height="600" aria-label="Çiftlik. Toprağa, hayvanlara ve pazara dokun."></canvas>
      <p class="tip" id="tip"></p>
      <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
    </div>
  </main>
</div>

<div class="overlay" id="title">
  <div class="logo"><canvas id="logoCv" width="300" height="150" aria-hidden="true"></canvas><h2>Minik Çiftlik</h2><p>Ek · Sula · Topla · Sat</p></div>
  <div class="menu-btns"><button class="pbtn" id="play" type="button">▶ Çiftliğe git</button></div>
  <button class="reset" id="reset" type="button" hidden>Çiftliği sıfırla</button>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
