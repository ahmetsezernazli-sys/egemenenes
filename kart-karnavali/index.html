<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kart Karnavalı · Egemen ve Enes'in Oyunları</title>
  <meta name="description" content="2-4 kişilik aile kart oyunu: rengi ya da sayıyı tutturan kartı oyna, özel kartlarla oyunu çevir, elini ilk bitiren kazanır.">
  <meta name="theme-color" content="#22143A">
  <meta property="og:title" content="Kart Karnavalı">
  <meta property="og:description" content="Rengi ya da sayıyı tuttur, +2 ve renk seç kartlarıyla oyunu çevir. 2-4 oyuncu, bilgisayar rakip.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Egemen ve Enes'in Oyunları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='14' y='8' width='58' height='84' rx='10' fill='%23E5484D' transform='rotate(-12 43 50)'/%3E%3Crect x='30' y='10' width='58' height='84' rx='10' fill='%23FFD23F' transform='rotate(10 59 52)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../index.html">← Oyunlar</a>
    <h1 class="title">Kart <span>Karnavalı</span></h1>
    <div class="bar-actions">
      <button class="icon-btn" id="sound" type="button" aria-label="Sesi kapat" aria-pressed="true">
        <span id="ic-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/></svg></span>
        <span id="ic-off" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg></span>
      </button>
      <button class="btn small" id="open-setup" type="button">Ayarlar</button>
    </div>
  </header>

  <main class="table" id="table">
    <div class="seats" id="seats"></div>

    <div class="center">
      <button class="pile draw" id="draw" type="button" aria-label="Deste: kart çek">
        <span class="back-art"></span>
        <b id="draw-count">108</b>
      </button>
      <div class="discard" id="discard" aria-live="polite"></div>
      <div class="state">
        <span class="color-dot" id="cur-color" aria-label="Sıradaki renk"></span>
        <span class="dir" id="dir" aria-label="Yön">⟳</span>
      </div>
    </div>

    <p class="msg" id="msg" role="status">Hazır mısınız?</p>

    <section class="hand-wrap">
      <div class="hand-head"><span class="who" id="hand-who">Enes</span><span class="count" id="hand-count">7 kart</span></div>
      <div class="hand" id="hand"></div>
    </section>
  </main>
</div>

<div class="overlay curtain" id="curtain" hidden>
  <div class="sheet center">
    <div class="av big" id="curtain-av">🚀</div>
    <p class="end-title" id="curtain-name">Enes'in sırası</p>
    <p class="lead">Kartlarını başkası görmesin. Hazırsan dokun.</p>
    <button class="btn primary big" id="curtain-go" type="button">Kartlarımı gör</button>
  </div>
</div>

<div class="overlay" id="color-pick" hidden>
  <div class="sheet center">
    <p class="end-title">Renk seç</p>
    <div class="colors">
      <button class="color-btn c0" data-c="0" type="button" aria-label="Kırmızı"></button>
      <button class="color-btn c1" data-c="1" type="button" aria-label="Sarı"></button>
      <button class="color-btn c2" data-c="2" type="button" aria-label="Yeşil"></button>
      <button class="color-btn c3" data-c="3" type="button" aria-label="Mavi"></button>
    </div>
  </div>
</div>

<div class="overlay" id="setup">
  <form class="sheet" id="setup-form">
    <h2>Kart Karnavalı</h2>
    <div class="p-rows" id="p-rows"></div>
    <div class="row">
      <button class="btn light" id="add-player" type="button">+ Oyuncu</button>
      <button class="btn light" id="remove-player" type="button">− Oyuncu</button>
    </div>
    <fieldset>
      <legend>Kurallar</legend>
      <label class="toggle"><input type="checkbox" id="hint" checked><span>✨ Oynanabilen kartlar parlasın</span></label>
      <label class="toggle"><input type="checkbox" id="stack"><span>➕ +2 üstüne +2 atılabilsin</span></label>
      <label class="toggle"><input type="checkbox" id="curtain-on" checked><span>🙈 Sıra değişince kartları gizle</span></label>
    </fieldset>
    <button class="btn primary big" type="submit">Oyunu başlat</button>
  </form>
</div>

<div class="overlay" id="end" hidden>
  <div class="sheet center">
    <div class="trophy" aria-hidden="true">🏆</div>
    <p class="end-title" id="end-title">Egemen kazandı!</p>
    <ol class="podium" id="podium"></ol>
    <div class="row">
      <button class="btn primary" id="again" type="button">Tekrar oyna</button>
      <button class="btn light" id="end-setup" type="button">Ayarlar</button>
    </div>
  </div>
</div>

<script src="game.js"></script>

<script>
  // sayfa adını tekleştir: /index.html ile / aynı satırda toplansın
  window.goatcounter = {path: function(p){ return p.replace(/index\.html$/, "") || "/"; }};
</script>
<script data-goatcounter="https://egemenenes.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
